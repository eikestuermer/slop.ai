[package]
name = "slop-reframe"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Smart cropping / reframing for vertical and square aspect ratios. ONNX-runtime subject detection (YOLOv11) with temporal smoothing."

[features]
default = []
ort = ["dep:ort"]

[dependencies]
slop-core = { workspace = true }
slop-media = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
ort = { version = "2.0.0-rc.10", optional = true, default-features = false, features = ["download-binaries", "ndarray"] }

[dev-dependencies]
