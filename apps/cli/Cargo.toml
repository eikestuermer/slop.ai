[package]
name = "slop-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Headless Slop AI CLI: ingest, plan, render, export. For CI/batch use without the desktop app."

[[bin]]
name = "slop"
path = "src/main.rs"

[dependencies]
slop-core = { workspace = true }
slop-media = { workspace = true }
slop-asr = { workspace = true }
slop-scenes = { workspace = true }
slop-score = { workspace = true }
slop-planner = { workspace = true }
slop-otio = { workspace = true }
slop-render = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
clap = { version = "4", features = ["derive"] }
