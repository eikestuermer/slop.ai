name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Sunday 03:00 UTC: mutation + fuzz pass.
    - cron: "0 3 * * 0"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# ---------------------------------------------------------------------------
# Slop AI production-readiness gate.
#
# Every job below is documented with what it proves and whether it is a hard
# gate on main or allowed-to-fail (the latter for jobs that depend on
# external services, GPU runners, or fixture media we are still building).
#
# Promoting an allowed-to-fail job to gating is itself a Phase B step: do it
# in the same PR that lands the green run on main.
# ---------------------------------------------------------------------------

jobs:
  # ============================================================
  # Tier 1: gating. Mirrors the local Phase A acceptance matrix.
  # ============================================================

  rust-stable-default:
    name: Rust default features (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Install Tauri prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev pkg-config build-essential ffmpeg

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo build (default features)
        run: cargo build --workspace

      - name: cargo test (default features)
        run: cargo test --workspace --no-fail-fast

  schemas:
    name: JSON Schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @slop/schemas validate
      - run: pnpm --filter @slop/schemas codegen

  frontend:
    name: Frontend (typecheck + lint + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @slop/schemas codegen
      - run: pnpm --filter @slop/desktop typecheck
      - run: pnpm --filter @slop/desktop lint
      - run: pnpm --filter @slop/desktop test
      - run: pnpm --filter @slop/web typecheck
      - run: pnpm --filter @slop/ui-timeline typecheck

  licenses:
    name: License + advisory audit (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # ============================================================
  # Tier 2: allowed-to-fail. Native-deps builds and integration
  # jobs that need fixture media or external services.
  #
  # These are wired so we have visibility on PRs without blocking
  # the merge. Each Phase B session promotes one to gating.
  # ============================================================

  rust-native-deps:
    name: Rust native-deps build (${{ matrix.os }}) [allowed-to-fail]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install build prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang ffmpeg \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev pkg-config build-essential
      - name: Install build prerequisites (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ffmpeg

      - name: cargo build --features ort
        run: cargo build -p slop-asr -p slop-reframe --features ort
      - name: cargo build --features whisper-cpp
        run: cargo build -p slop-asr --features whisper-cpp
      - name: cargo test --features ort
        run: cargo test -p slop-asr -p slop-reframe --features ort

  integration-whisper:
    name: Integration - whisper.cpp end-to-end [allowed-to-fail]
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: rust-native-deps
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install ffmpeg + cmake
        run: sudo apt-get update && sudo apt-get install -y ffmpeg cmake clang
      - name: Run whisper integration suite
        run: |
          # Phase B target: download ggml-tiny.en.bin, transcribe a
          # 30-second fixture WAV, assert WER < 10% against the
          # checked-in ground-truth.
          # Tracked as S-ASR-001 in docs/stubs.md.
          echo "TODO: integration-whisper not yet implemented"
          exit 0

  integration-onnx-pyannote:
    name: Integration - pyannote diarization [allowed-to-fail]
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: rust-native-deps
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install ffmpeg + cmake
        run: sudo apt-get update && sudo apt-get install -y ffmpeg cmake clang
      - name: Run pyannote integration suite
        run: |
          # Phase B target: download pyannote ONNX models, run
          # Diarizer::diarize on a 2-speaker fixture, assert > 0.7 DER.
          # Tracked as S-DIAR-001 in docs/stubs.md.
          echo "TODO: integration-onnx-pyannote not yet implemented"
          exit 0

  integration-yolo:
    name: Integration - YOLOv11 reframe [allowed-to-fail]
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: rust-native-deps
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run YOLO integration suite
        run: |
          # Phase B target: download yolo11n.onnx, run YoloDetector::detect
          # on a fixture image, assert person bbox within 10px of ground-truth.
          # Tracked as S-YOLO-001 in docs/stubs.md.
          echo "TODO: integration-yolo not yet implemented"
          exit 0

  integration-ffmpeg-render:
    name: Integration - ffmpeg render fixture project [allowed-to-fail]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Run render integration suite
        run: |
          # Phase B target: run `slop render` on a fixture project, assert
          # output MP4 is decodable and matches a checksummed golden frame.
          echo "TODO: integration-ffmpeg-render not yet implemented"
          exit 0

  integration-otio-roundtrip:
    name: Integration - OTIO round-trip via otioconvert [allowed-to-fail]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install xmllint + otio-py
        run: |
          sudo apt-get update && sudo apt-get install -y libxml2-utils
          pip install opentimelineio
      - name: Run OTIO round-trip suite
        run: |
          # Phase B target: emit OTIO + FCP7 + FCPXML + Kdenlive on a
          # fixture project; assert otioconvert + xmllint all parse.
          echo "TODO: integration-otio-roundtrip not yet implemented"
          exit 0

  integration-sync:
    name: Integration - sync server CRDT convergence [allowed-to-fail]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run sync convergence suite
        run: |
          # Phase B target: spin up slop-sync-server, connect two
          # client TimelineDocs, apply concurrent edits, assert
          # post-sync state is identical.
          echo "TODO: integration-sync not yet implemented"
          exit 0

  integration-plugin:
    name: Integration - Wasmtime plugin round-trip [allowed-to-fail]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - name: Run plugin integration suite
        run: |
          # Phase B target: build examples/plugins/hello-effect into a
          # WASM component, load it into PluginHost, assert a tool call
          # round-trips with the right output.
          echo "TODO: integration-plugin not yet implemented"
          exit 0

  integration-tauri:
    name: Integration - Tauri build (${{ matrix.os }}) [allowed-to-fail]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install Tauri prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev pkg-config build-essential
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @slop/schemas codegen
      - name: Run icons generator
        run: pnpm icons || echo "icons skipped"
      - name: tauri build (no signing)
        run: |
          # Phase B target: produce signed/notarized installers via
          # APPLE_SIGNING_IDENTITY + AZURE_TS_* secrets when present.
          # For now we build unsigned to verify the pipeline.
          cd apps/desktop
          pnpm tauri build || echo "tauri build skipped (Phase B target)"

  integration-bindings-py:
    name: Integration - PyO3 wheel build + import [allowed-to-fail]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
