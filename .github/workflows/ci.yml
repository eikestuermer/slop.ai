      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install maturin
      - name: Build + install + smoke
        working-directory: bindings/python
        run: |
          maturin build --release
          pip install --find-links target/wheels/ slop-ai
          python -c "import slop_py; t = slop_py.PyTimeline(); print(t.to_json())"

  integration-bindings-node:
    name: Integration - napi-rs build + require [allowed-to-fail]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build + smoke
        working-directory: bindings/node
        run: |
          pnpm build
          node -e "const m = require('./'); const t = new m.JsTimeline(); console.log(t.toJson());"

  integration-a11y:
    name: Integration - axe-core WCAG 2.2 AA [allowed-to-fail]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright + axe
        run: |
          pnpm add -D @axe-core/playwright playwright
          npx playwright install --with-deps chromium
      - name: Start web companion + run audit
        run: |
          pnpm --filter @slop/web build
          pnpm --filter @slop/web preview &
          sleep 5
          SLOP_AXE_URL=http://localhost:5174 node scripts/a11y-audit.mjs

  # ============================================================
  # Tier 3: scheduled. Mutation + fuzz coverage.
  # Run weekly so they don't block PRs but we get drift signals.
  # ============================================================

  mutants:
    name: Mutation testing (slop-core) [scheduled]
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install --locked cargo-mutants
      - name: Run cargo-mutants on slop-core
        run: |
          cargo mutants --package slop-core --no-shuffle --timeout 120 \
            || echo "mutants run completed (allowed-to-fail until ≥80% kill rate)"

  fuzz:
    name: Fuzz (validator + OTIO writer) [scheduled]
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install --locked cargo-fuzz
      - name: Run fuzzers (60 minutes per target, capped)
        run: |
          # Phase B target: real fuzz harnesses for validator + OTIO writer.
          # Tracked as S-VERIF-003 in docs/stubs.md.
          echo "TODO: fuzz harnesses not yet implemented"
