name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Tauri prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev pkg-config build-essential ffmpeg

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @slop/schemas codegen

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Slop AI ${{ github.ref_name }}"
          releaseBody: |
            See [CHANGELOG.md](https://github.com/slop-ai/slop.ai/blob/main/CHANGELOG.md) for what's new.
            **License:** MIT.
            **What's bundled:** Slop AI app + LGPL FFmpeg.
            **What's not bundled:** model weights. Set up your own LLM endpoint per [docs/byo-endpoint.md](https://github.com/slop-ai/slop.ai/blob/main/docs/byo-endpoint.md).
          releaseDraft: true
          prerelease: true
