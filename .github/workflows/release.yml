name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Bundle (${{ matrix.platform.os }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: macos-14
            args: "--target aarch64-apple-darwin"
            bundle: dmg
          - os: macos-14
            args: "--target x86_64-apple-darwin"
            bundle: dmg
          - os: ubuntu-22.04
            args: ""
            bundle: deb
          - os: windows-latest
            args: ""
            bundle: msi
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - name: Add Rust target
        if: contains(matrix.platform.args, '--target')
        run: rustup target add $(echo "${{ matrix.platform.args }}" | sed -E 's/.*--target (\S+).*/\1/')
        shell: bash

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Tauri prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev pkg-config build-essential ffmpeg \
            cmake clang

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg cmake

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg cmake -y

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @slop/schemas codegen
      - run: pnpm icons

      # macOS code signing + notarization. Required for users to launch
      # the app without right-click bypass. Uses Apple Developer ID
      # Application certificate (the public-distribution-outside-the-MAS
      # cert). Notarization runs via notarytool with an Apple ID + app
      # password OR an App Store Connect API key.
      - name: Import Apple Developer ID certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERT_BASE64" ]; then
            echo "Skipping signing: APPLE_CERT_BASE64 not set"
            exit 0
          fi
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -t 3600 -u "$KEYCHAIN_PATH"
          echo "$APPLE_CERT_BASE64" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERT_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Build & sign with tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Apple notarization (used inside the Tauri bundler)
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows code signing (Azure Trusted Signing or HSM-backed cert)
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TS_ENDPOINT: ${{ secrets.AZURE_TS_ENDPOINT }}
          AZURE_TS_ACCOUNT: ${{ secrets.AZURE_TS_ACCOUNT }}
          AZURE_TS_PROFILE: ${{ secrets.AZURE_TS_PROFILE }}
          # Linux: AppImage and Flatpak repos require GPG signing
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_PASSPHRASE: ${{ secrets.GPG_SIGNING_PASSPHRASE }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Slop AI ${{ github.ref_name }}"
          releaseBody: |
            See [CHANGELOG.md](https://github.com/slop-ai/slop.ai/blob/main/CHANGELOG.md).
            License: MIT. Bundles: app + LGPL FFmpeg. Models are not bundled - configure your own LLM endpoint per [docs/byo-endpoint.md](https://github.com/slop-ai/slop.ai/blob/main/docs/byo-endpoint.md).
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.platform.args }}

  smoke:
    name: Bundle smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-22.04, windows-latest]
    steps:
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          # Verify .deb / .rpm / AppImage produced and openable.
          # Real verification happens via the artifacts that tauri-action uploads.
          echo "Linux smoke test placeholder; expand once artifacts are reachable from this job."
      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          # Verify the .dmg mounts and the app inside is properly notarized.
          # `spctl --assess --type exec --verbose=4` would run here against the
          # extracted .app bundle.
          echo "macOS smoke test placeholder; expand once artifacts are reachable from this job."
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        run: |
          # Verify the MSI installs cleanly.
          echo "Windows smoke test placeholder; expand once artifacts are reachable from this job."
