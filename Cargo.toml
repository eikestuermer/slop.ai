[workspace]
resolver = "2"
members = [
    "crates/slop-core",
    "crates/slop-media",
    "crates/slop-asr",
    "crates/slop-scenes",
    "crates/slop-score",
    "crates/slop-planner",
    "crates/slop-otio",
    "crates/slop-render",
    "crates/slop-multicam",
    "crates/slop-color",
    "crates/slop-mixer",
    "crates/slop-transitions",
    "crates/slop-captions",
    "crates/slop-vision",
    "crates/slop-agent",
    "crates/slop-genav",
    "crates/slop-reframe",
    "crates/slop-sync",
    "crates/slop-plugin",
    "apps/desktop/src-tauri",
    "apps/sync-server",
    "apps/cli",
    "bindings/python",
    "bindings/node",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/slop-ai/slop.ai"
rust-version = "1.75"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "0.8", features = ["uuid1", "chrono"] }
thiserror = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "io-util", "sync"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
jsonschema = { version = "0.18", default-features = false, features = ["draft202012"] }
regex = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
hound = "3.5"

slop-core = { path = "crates/slop-core", version = "0.1" }
slop-media = { path = "crates/slop-media", version = "0.1" }
slop-asr = { path = "crates/slop-asr", version = "0.1" }
slop-scenes = { path = "crates/slop-scenes", version = "0.1" }
slop-score = { path = "crates/slop-score", version = "0.1" }
slop-planner = { path = "crates/slop-planner", version = "0.1" }
slop-otio = { path = "crates/slop-otio", version = "0.1" }
slop-render = { path = "crates/slop-render", version = "0.1" }
slop-multicam = { path = "crates/slop-multicam", version = "0.1" }
slop-color = { path = "crates/slop-color", version = "0.1" }
slop-mixer = { path = "crates/slop-mixer", version = "0.1" }
slop-transitions = { path = "crates/slop-transitions", version = "0.1" }
slop-captions = { path = "crates/slop-captions", version = "0.1" }
slop-vision = { path = "crates/slop-vision", version = "0.1" }
slop-agent = { path = "crates/slop-agent", version = "0.1" }
slop-genav = { path = "crates/slop-genav", version = "0.1" }
slop-reframe = { path = "crates/slop-reframe", version = "0.1" }
slop-sync = { path = "crates/slop-sync", version = "0.1" }
slop-plugin = { path = "crates/slop-plugin", version = "0.1" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
